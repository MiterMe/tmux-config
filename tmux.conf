# Tmux 配置
# 从 wezterm 迁移 - 使用直接按键模式

# ============================================
# 基础设置
# ============================================
# 索引从 1 开始
set -g base-index 1
setw -g pane-base-index 1

# 鼠标支持
set -g mouse on

# 历史记录
set -g history-limit 10000

# 减少 ESC 延迟
set -sg escape-time 0

# 重新编号窗口（关闭窗口后）
set -g renumber-windows on

# Ctrl+D 保留 shell 的 EOF 行为；与 WezTerm 一样用 Alt+Shift+O、d 分离。
# 同时清理旧配置的绑定，确保 source-file 重载后也生效。
unbind-key -n C-d
set -g destroy-unattached off
set -s set-clipboard on
set -s extended-keys on

# ============================================
# 直接按键操作；保留 Alt+Shift+B 作为 tmux 高级命令的备用 prefix
# ============================================
unbind C-b
set -g prefix M-B

# Alt+Shift+R 重载 tmux 配置（WezTerm 对应 ReloadConfiguration）
bind -n M-R source-file ~/.config/tmux/tmux.conf \; display-message "tmux 配置已重载"

# Ctrl+Shift+P 打开 tmux 命令提示（对应 WezTerm 的命令面板）
bind -n C-S-p command-prompt

# 粘贴优先由 Ghostty/WezTerm 从本机剪贴板完成，支持 SSH 场景。
# 终端未拦截这些键时，回退到 tmux buffer；本机 macOS 使用 pbpaste。
bind -n M-V paste-buffer -p
bind -n C-S-v paste-buffer -p
bind -n S-Insert paste-buffer -p
if-shell 'command -v pbpaste >/dev/null 2>&1' {
    bind -n M-V run-shell 'pbpaste | tmux load-buffer -b clipboard-#{pane_id} - \; paste-buffer -p -d -b clipboard-#{pane_id} -t #{pane_id}'
    bind -n C-S-v run-shell 'pbpaste | tmux load-buffer -b clipboard-#{pane_id} - \; paste-buffer -p -d -b clipboard-#{pane_id} -t #{pane_id}'
    bind -n S-Insert run-shell 'pbpaste | tmux load-buffer -b clipboard-#{pane_id} - \; paste-buffer -p -d -b clipboard-#{pane_id} -t #{pane_id}'
}

# ============================================
# Window (Tab) 操作
# ============================================
# Shift+Alt+T 新建窗口 (M-T = Alt+Shift+T)
bind -n M-T new-window

# Alt+H 上一个窗口
bind -n M-h previous-window

# Alt+L 下一个窗口
bind -n M-l next-window

# ============================================
# Pane 操作
# ============================================
# Shift+Alt+P 右侧新建 pane (M-P = Alt+Shift+P, 水平分割)
bind -n M-P split-window -h -c "#{pane_current_path}"

# Shift+Alt+D 下方新建 pane (M-D = Alt+Shift+D, 垂直分割)
bind -n M-D split-window -v -c "#{pane_current_path}"

# Shift+Alt+H/J/K/L 切换 pane (M-H/J/K/L = Alt+Shift+H/J/K/L)
bind -n M-H select-pane -L
bind -n M-J select-pane -D
bind -n M-K select-pane -U
bind -n M-L select-pane -R

# Alt+方向键 调整 pane 大小，每次 5 格（不需要 Shift）
bind -n M-Left resize-pane -L 5
bind -n M-Right resize-pane -R 5
bind -n M-Up resize-pane -U 5
bind -n M-Down resize-pane -D 5

# ============================================
# Session 操作 (键表模式)
# ============================================
# Shift+Alt+O 进入 session 模式 (M-O = Alt+Shift+O)
bind -n M-O switch-client -T session_mode

# Session 模式快捷键
bind -T session_mode s choose-session
bind -T session_mode d detach-client
bind -T session_mode n command-prompt -p "Session name:" "new-session -A -s '%%%' -c '#{pane_current_path}'"
bind -T session_mode Escape switch-client -Troot

# ============================================
# Copy 模式
# ============================================
# Shift+Alt+X 进入 copy 模式 (M-X = Alt+Shift+X)
bind -n M-X copy-mode

# 使用 vi 模式
setw -g mode-keys vi

# Copy 模式与 WezTerm 的 copy_mode 对齐
bind -T copy-mode-vi h send -X cursor-left
bind -T copy-mode-vi j send -X cursor-down
bind -T copy-mode-vi k send -X cursor-up
bind -T copy-mode-vi l send -X cursor-right
bind -T copy-mode-vi w send -X next-word
bind -T copy-mode-vi b send -X previous-word
bind -T copy-mode-vi e send -X next-word-end
bind -T copy-mode-vi 0 send -X start-of-line
bind -T copy-mode-vi ^ send -X back-to-indentation
bind -T copy-mode-vi '$' send -X end-of-line
bind -T copy-mode-vi g send -X history-top
bind -T copy-mode-vi G send -X history-bottom
bind -T copy-mode-vi H send -X top-line
bind -T copy-mode-vi M send -X middle-line
bind -T copy-mode-vi L send -X bottom-line
bind -T copy-mode-vi v send -X rectangle-off \; send -X begin-selection
bind -T copy-mode-vi V send -X rectangle-off \; send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-on \; send -X begin-selection
bind -T copy-mode-vi o send -X other-end
# tmux 只有 other-end，O 使用同一个选择端点切换命令。
bind -T copy-mode-vi O send -X other-end
bind -T copy-mode-vi / command-prompt -T search -p "Search forward:" { send -X search-forward "%%" }
bind -T copy-mode-vi ? command-prompt -T search -p "Search backward:" { send -X search-backward "%%" }
bind -T copy-mode-vi n send -X search-again
bind -T copy-mode-vi N send -X search-reverse
bind -T copy-mode-vi Escape send -X cancel
bind -T copy-mode-vi q send -X cancel
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel
if-shell 'command -v pbcopy >/dev/null 2>&1' 'set -s copy-command pbcopy'

# 扩展键协议会保留 Shift，字母可能是小写或大写：M-S-p / M-S-P。
# 两者都需要绑定；传统 ESC+大写字母编码则是 M-P。
# -K 把扩展编码交给当前客户端重新查键表，复用上面的绑定。
bind -n M-S-r send-keys -K M-R
bind -n M-S-R send-keys -K M-R
bind -n M-S-v send-keys -K M-V
bind -n M-S-V send-keys -K M-V
bind -n M-S-t send-keys -K M-T
bind -n M-S-T send-keys -K M-T
bind -n M-S-p send-keys -K M-P
bind -n M-S-P send-keys -K M-P
bind -n M-S-d send-keys -K M-D
bind -n M-S-D send-keys -K M-D
bind -n M-S-h send-keys -K M-H
bind -n M-S-H send-keys -K M-H
bind -n M-S-j send-keys -K M-J
bind -n M-S-J send-keys -K M-J
bind -n M-S-k send-keys -K M-K
bind -n M-S-K send-keys -K M-K
bind -n M-S-l send-keys -K M-L
bind -n M-S-L send-keys -K M-L
bind -n M-S-o send-keys -K M-O
bind -n M-S-O send-keys -K M-O
bind -n M-S-x send-keys -K M-X
bind -n M-S-X send-keys -K M-X
bind -n M-S-b send-keys -K M-B
bind -n M-S-B send-keys -K M-B
bind -n C-S-P send-keys -K C-S-p
bind -n C-S-V send-keys -K C-S-v

# ============================================
# 状态栏位置
# ============================================
set -g status-position top

# ============================================
# 窗口标题设置
# ============================================
# 启用窗口标题更新
set -g set-titles on
set -g set-titles-string "#{session_name}"

set -g allow-passthrough on
set -g default-terminal "tmux-256color"
set -as terminal-features ",wezterm:RGB:extkeys,xterm-ghostty:RGB:extkeys"
set -as terminal-overrides ',*:Tc'


set -g @catppuccin_flavor 'macchiato'
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux
set -g status-left '#[fg=#{@thm_crust},bg=#{@thm_teal}] session: #S '
set -g status-left-length 100